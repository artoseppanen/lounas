<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lounas — konseptidemo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --ink: #1c2b24;
    --paper: #ffffff;
    --accent: #14a098;
    --accent-text: #0f7872; /* tummennettu versio accentista: täyttää 4.5:1 tekstinä valkoisella/vaalealla */
    --accent-soft: #e7d9c9;
    --line: #d8d0c0;
    --line-strong: #97845e; /* tummennettu reuna interaktiivisille komponenteille (3:1 vaatimus) */
    --muted: #5b6a61; /* korvaa aiemman liian vaalean #93998f:n (2.9:1 -> ei täyttänyt 4.5:1) */
    font-family: 'Manrope', -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  button, input { font-family: inherit; }
  button:focus-visible,
  [role="button"]:focus-visible,
  a:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent-text);
    outline-offset: 2px;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
  }
  body {
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .brand-logo { flex-shrink: 0; }
  header h1 {
    margin: 0;
    font-family: 'Caveat', cursive;
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .filter-btn {
    position: relative;
    border: 1px solid var(--ink);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13.5px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .filter-btn .count {
    color: var(--ink);
    margin-left: 2px;
    font-weight: 400;
  }
  .loading-banner {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 13px;
    color: #5b6a61;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .loading-banner.visible { display: flex; }
  .loading-banner.error { color: #5b6a61; }
  .chef-icon {
    font-size: 18px;
    display: inline-block;
    animation: chefWalk 1.1s ease-in-out infinite;
  }
  .loading-banner.error .chef-icon { animation: none; display: none; }
  .error-icon { display: none; align-items: center; }
  .loading-banner.error .error-icon { display: inline-flex; }
  @keyframes chefWalk {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(16px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chef-icon { animation: none; }
  }
  main {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #map {
    position: absolute;
    inset: 0;
  }
  #listView, #favView {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: none;
    background: #f2f2f0;
    padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  }
  @media (max-width: 989px) {
    #map, #listView, #favView { display: none; }
    #map.m-active, #listView.m-active, #favView.m-active { display: block; }
  }
  #sidebar, #mapWrap, .sidebar-inner { display: contents; }
  .sidebar-tabs { display: none; }
  .sidebar-collapse-btn { display: none; }

  /* Listanäkymän oma yläpalkki: suodatinvalinta + laskuri */
  .list-toolbar {
    position: sticky;
    top: 0;
    background: #f2f2f0;
    padding: 16px 16px 14px;
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .segment {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .seg-btn {
    flex: 1;
    padding: 7px 0;
    text-align: center;
    border: 1px solid var(--ink);
    border-radius: 999px;
    background: #fff;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .seg-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .list-count {
    font-size: 12.5px;
    color: #5b6a61;
  }
  .list-count b { color: var(--ink); }
  .list-count .status { color: var(--muted); }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .search-wrap {
    position: relative;
    margin: 12px 0;
  }
  .name-search {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 56px 9px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    font-size: 13.5px;
    background: #fff;
    color: var(--ink);
  }
  .name-search:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .name-search::-webkit-search-cancel-button { display: none; }
  .search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search-clear {
    display: none;
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    box-shadow: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .search-clear.visible { display: flex; }

  #listCards, #favView { padding-left: 16px; padding-right: 16px; }
  #listCards { padding-top: 10px; }
  #favView { padding-top: 14px; }

  .card {
    background: #fff;
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    box-shadow: 0 4px 14px rgba(28,43,36,0.12);
    border-color: #fff;
  }
  .card:active { background: var(--accent-soft); }
  .card-top, .popup-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .popup-top { margin-bottom: 2px; }
  .card h3 {
    margin: 0;
    font-size: 15.5px;
  }
  .genre {
    display: inline-block;
    font-size: 11.5px;
    color: #3d453f;
    background: #e3e3e0;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .genre-plain {
    font-size: 11.5px;
    color: #5b6a61;
  }
  .addr {
    margin: 5px 0 0;
    font-size: 12.5px;
    color: #5b6a61;
  }
  .pin-icon {
    color: #5b6a61;
    vertical-align: -1px;
    margin-right: 2px;
  }
  .website-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--accent-text);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .website-link:active { opacity: 0.7; }
  .hours {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: #5b6a61;
  }
  .hours.hours-warning {
    color: #c0392b;
    font-weight: 500;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 0 16px;
  }
  .leaflet-popup-content h3 {
    margin: 0 0 3px;
    font-size: 14px;
  }
  .leaflet-popup-content .genre {
    margin-bottom: 4px;
  }
  .popup-actions, .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .heart {
    background: none;
    border: none;
    font-size: 26px;
    line-height: 1;
    padding: 4px;
    cursor: pointer;
    color: var(--accent);
    flex-shrink: 0;
  }
  .stars { display: inline-flex; gap: 1px; }
  .star {
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    color: var(--accent);
  }
  .rating-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .stars-display {
    position: relative;
    display: inline-block;
    width: 6.4em;
    height: 1.1em;
    font-size: 21px;
    line-height: 1;
  }
  .stars-bg, .stars-fg, .stars-hover {
    position: absolute;
    top: 0;
    left: 0;
    white-space: nowrap;
    letter-spacing: 4px;
  }
  .stars-bg { color: var(--line); }
  .stars-fg {
    overflow: hidden;
    color: var(--accent);
    pointer-events: none;
  }
  .stars-hover {
    overflow: hidden;
    color: var(--accent-text);
    width: 0%;
    pointer-events: none;
  }
  .stars-display.hovering .stars-fg { visibility: hidden; }
  .stars-click {
    position: absolute;
    inset: 0;
    display: flex;
    gap: 3px;
  }
  .stars-click span,
  .stars-click button {
    flex: 1;
    height: 100%;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .rating-meta {
    font-size: 11.5px;
    color: #5b6a61;
    white-space: nowrap;
  }
  .leaflet-popup-content { margin: 10px 12px; }
  .leaflet-popup-content-wrapper { max-width: 240px; }

  /* Kelluva pohjanavigaatio kartan päällä */
  .bottom-nav {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: calc(15px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 6px;
    padding: 6px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(28,43,36,0.15);
    z-index: 1000;
  }
  .navtab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    border: none;
    background: none;
    border-radius: 999px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
  }
  .navtab.active {
    background: var(--ink);
    color: var(--paper);
  }

  /* Suodatinpaneeli */
  .filter-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--paper);
    z-index: 2000;
    display: none;
    flex-direction: column;
  }
  .filter-overlay.open { display: flex; }
  .filter-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .filter-topbar h2 { margin: 0; font-size: 17px; }
  .filter-close {
    border: none;
    background: none;
    font-size: 14px;
    color: var(--accent-text);
    cursor: pointer;
    padding: 4px 6px;
  }
  .filter-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 24px;
  }
  .filter-section { margin-bottom: 22px; }
  .filter-section h3 {
    margin: 0 0 4px;
    font-size: 13px;
    color: #5b6a61;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .filter-subheading {
    margin: 14px 0 0;
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }
  .filter-note {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .chip-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
  }
  .chip {
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .chip.disabled {
    opacity: 0.45;
    cursor: default;
  }
  .filter-footer {
    display: flex;
    gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .filter-footer button {
    border-radius: 999px;
    padding: 12px 0;
    font-size: 14.5px;
    cursor: pointer;
  }
  #filterReset {
    flex: 1;
    background: #fff;
    border: 1px solid var(--ink);
    color: var(--ink);
  }
  #filterApply {
    flex: 2;
    background: var(--ink);
    border: none;
    color: var(--paper);
  }
  .filter-backdrop { display: none; }

  /* ===== Työpöytäversio (>=990px): pysyvä 400px sivupalkki + tumma overlay suodattimille ===== */
  @media (min-width: 990px) {
    main {
      display: flex;
      flex-direction: row;
    }
    #sidebar {
      display: flex;
      flex-direction: column;
      position: relative;
      width: 400px;
      flex-shrink: 0;
      height: 100%;
      border-right: 1px solid var(--line);
      background: #f2f2f0;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    #sidebar.collapsed { width: 44px; }
    .sidebar-inner {
      display: flex;
      flex-direction: column;
      width: 400px;
      height: 100%;
      flex-shrink: 0;
    }
    #sidebar.collapsed .sidebar-inner { display: none; }
    .sidebar-collapse-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 12px;
      right: 10px;
      width: 28px;
      height: 28px;
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--ink);
      cursor: pointer;
      z-index: 5;
    }
    #sidebar.collapsed .sidebar-collapse-btn { right: 8px; }
    .sidebar-collapse-btn svg { transition: transform 0.2s ease; }
    #sidebar.collapsed .sidebar-collapse-btn svg { transform: scaleX(-1); }
    #mapWrap {
      display: block;
      position: relative;
      flex: 1;
      height: 100%;
    }
    #map {
      position: absolute;
      inset: 0;
      display: block;
    }
    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      padding-right: 48px;
    }
    .sidebar-tab {
      flex: 1;
      padding: 16px 0 13px;
      text-align: center;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 15px;
      color: var(--ink);
      cursor: pointer;
    }
    .sidebar-tab.active {
      color: var(--ink);
      font-weight: 600;
      border-bottom-color: var(--accent-text);
    }
    #listView, #favView {
      position: static;
      display: none;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 16px;
    }
    #listView.d-active, #favView.d-active { display: block; }

    .bottom-nav { display: none; }

    .filter-overlay {
      left: auto;
      right: 0;
      width: 400px;
      border-left: 1px solid var(--line);
    }
    .filter-backdrop.open {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, 0.45);
      z-index: 1999;
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 72 48.4" width="36" height="24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="var(--accent)" d="M36.7,0.4C23.6,0.4,13,11,13,24.1c0,13.1,10.6,23.7,23.7,23.7c13.1,0,23.7-10.6,23.7-23.7
        C60.4,11,49.8,0.4,36.7,0.4 M36.7,42.9c-10.4,0-18.8-8.4-18.8-18.8c0-10.4,8.4-18.8,18.8-18.8c10.4,0,18.8,8.4,18.8,18.8
        C55.5,34.4,47.1,42.9,36.7,42.9"/>
      <path fill="var(--accent)" d="M36.7,7.4C27.5,7.4,20,14.9,20,24.1s7.5,16.7,16.7,16.7c9.2,0,16.7-7.5,16.7-16.7S45.9,7.4,36.7,7.4"/>
      <path fill="var(--accent)" d="M9,3.3c0-0.8-1.3-0.8-1.3,0c0,0.6-0.1,10.6-0.1,11.2c0,0.7-0.8,0.7-0.8,0c-0.1-0.7-0.2-11-0.2-11.3
        c0-0.7-1.3-0.8-1.3,0c0,0.4-0.1,11.2-0.1,11.5c0,0.4-0.5,0.4-0.5,0.4s-0.5,0-0.5-0.4c0-0.4-0.1-11.1-0.1-11.5c0-0.9-1.3-0.8-1.3,0
        c0,0.3-0.1,10.7-0.2,11.3c-0.1,0.7-0.8,0.7-0.8,0c0-0.7-0.1-10.6-0.1-11.2c0-0.8-1.3-0.8-1.3,0c0,0.4-0.3,7.4-0.3,11
        c-0.1,3.6,0.9,5.7,2.1,6.7c0.4,0.3,0.9,0.8,0.9,1.5L2.9,43.8c0,1,0.8,1.8,1.8,1.8c1,0,1.8-0.8,1.8-1.8L6.3,22.4
        c0-0.7,0.5-1.2,0.9-1.5c1.3-0.9,2.2-3.1,2.1-6.7C9.3,10.7,9,3.7,9,3.3"/>
      <path fill="var(--accent)" d="M71.2,21V3.6c0-3.2-5.7,1.2-6.1,12.8c0,0.4-0.1,3.7-0.1,5.3c0,3.6,0.7,4.7,2.1,5.3c0.4,0.2,1,0.5,1,0.5
        l-0.3,16.4c0,1,0.8,1.8,1.8,1.8c1,0,1.8-0.8,1.8-1.8L71.2,21z"/>
    </svg>
    <h1>Lounas</h1>
  </div>
  <button class="filter-btn" id="openFilter" aria-haspopup="dialog" aria-expanded="false">Suodata<span class="count" id="filterCount"></span></button>
</header>

<div id="loadingBanner" class="loading-banner" role="status" aria-live="polite">
  <span class="chef-icon">🧑‍🍳</span>
  <span class="error-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="18" height="18">
      <circle cx="12" cy="12" r="11" fill="#c0392b"/>
      <rect x="11" y="6" width="2" height="8" fill="#fff"/>
      <rect x="11" y="16" width="2" height="2" fill="#fff"/>
    </svg>
  </span>
  <span class="loading-text">Haetaan ravintolat</span>
</div>

<main>
  <div id="sidebar">
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Pienennä lista-palkki" aria-expanded="true">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1.5" y="2.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="7.5" y1="2.5" x2="7.5" y2="17.5" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
    <div class="sidebar-inner" id="sidebarInner">
      <div class="sidebar-tabs" id="sidebarTabs" role="tablist" aria-label="Lista tai suosikit">
        <button class="sidebar-tab active" id="sbTabList" role="tab" aria-selected="true">Lista</button>
        <button class="sidebar-tab" id="sbTabFav" role="tab" aria-selected="false">Suosikit</button>
      </div>

      <div id="listView">
        <div class="list-toolbar">
          <div class="segment">
            <button class="seg-btn active" id="filterVisible">Kartalla näkyvät</button>
            <button class="seg-btn" id="filterAll">Kaikki ravintolat</button>
          </div>
          <div class="search-wrap">
            <label for="nameSearch" class="visually-hidden">Hae ravintolaa nimellä</label>
            <input type="search" id="nameSearch" class="name-search" placeholder="Hae ravintolaa nimellä" autocomplete="off">
            <button type="button" class="search-clear" id="searchClear" aria-label="Tyhjennä haku">×</button>
            <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>

<script>
// Oikea Overpass-haku. Julkinen, avoin rajapinta, ei API-avainta.
// HUOM tuotannossa: älä anna sovelluksen jokaisen käyttäjän kutsua julkista
// overpass-api.de -instanssia suoraan (usage policy kieltää raskaan pollauksen).
// Aja tämä oman backendin kautta, joka välimuistittaa vastaukset esim. tunniksi.
const OVERPASS_URL = "https://overpass-api.de/api/interpreter";

// Koko Tampereen kattava kiinteä alue — haetaan kerran, kun sovellus avataan.
// Ei sidottu näkyvään karttarajaukseen, joten pan/zoom ei enää koskaan laukaise uutta hakua.
const TAMPERE_BBOX = { s: 61.435, w: 23.640, n: 61.560, e: 23.900 };

let restaurants = [];
let listFilterMode = 'visible'; // 'visible' | 'all'
let currentTab = 'map';

// Mäppäys OSM:n cuisine-tagista annettuihin suomenkielisiin tyyppikategorioihin.
// Avainsanat on tarkistettu OSM:n virallisesta Key:cuisine-dokumentaatiosta
// (wiki.openstreetmap.org/wiki/Key:cuisine), ei enää pelkkää arvausta — silti
// yksi ravintola voi jäädä ilman kategoriaa jos cuisine-tietoa ei ole tagattu,
// ja osa harvinaisemmista arvoista (esim. "pub", "street_food") on yhä heikommin
// vahvistettuja kuin selkeät etnisyysarvot (italian, chinese, thai jne).
const CUISINE_CATEGORIES = [
  { label: "Aasialainen", match: ["asian"], group: "nationality" },
  { label: "Baari/pubiruokaa", match: ["pub"], group: "style" },
  { label: "Afrikkalainen", match: ["african"], group: "nationality" },
  { label: "Amerikkalainen", match: ["american"], group: "nationality" },
  { label: "Espanjalainen", match: ["spanish"], group: "nationality" },
  { label: "Eurooppalainen", match: ["european"], group: "nationality" },
  { label: "Fine dining", match: ["fine_dining"], group: "style" },
  { label: "Hampurilainen", match: ["burger"], group: "style" },
  { label: "Intialainen", match: ["indian"], group: "nationality" },
  { label: "Italialainen", match: ["italian"], group: "nationality" },
  { label: "Japanilainen", match: ["japanese", "sushi"], group: "nationality" },
  { label: "Kahvila", match: ["coffee_shop"], amenity: "cafe", group: "style" },
  { label: "Kansainvälinen", match: ["international"], group: "style" },
  { label: "Kiinalainen", match: ["chinese", "cantonese", "sichuanese"], group: "nationality" },
  { label: "Lähi-Itä", match: ["middle_eastern", "lebanese", "arab", "syrian"], group: "nationality" },
  { label: "Nepalilainen", match: ["nepalese"], group: "nationality" },
  { label: "Marokkolainen", match: ["moroccan"], group: "nationality" },
  { label: "Meksikolainen", match: ["mexican", "tex-mex"], group: "nationality" },
  { label: "Moderni", match: ["modern", "fusion"], group: "style" },
  { label: "Etninen", match: ["ethnic"], group: "style" },
  { label: "Perinteinen", match: ["regional", "traditional"], group: "style" },
  { label: "Pikaruoka", match: ["fast_food"], amenity: "fast_food", group: "style" },
  { label: "Pizza", match: ["pizza"], group: "style" },
  { label: "Ranskalainen", match: ["french"], group: "nationality" },
  { label: "Skandinaavinen", match: ["scandinavian", "nordic"], group: "nationality" },
  { label: "Street kitchen", match: ["street_food"], group: "style" },
  { label: "Suomalainen", match: ["finnish"], group: "nationality" },
  { label: "Thaimaalainen", match: ["thai"], group: "nationality" },
  { label: "Venäläinen", match: ["russian"], group: "nationality" },
  { label: "Vietnamilainen", match: ["vietnamese"], group: "nationality" },
  { label: "Välimeri", match: ["mediterranean", "greek"], group: "nationality" },
  { label: "Saksalainen", match: ["german"], group: "nationality" },
  { label: "Pihvi", match: ["steak_house"], group: "style" }
];

function computeCategories(rawCuisine, amenity) {
  const raw = (rawCuisine || "").toLowerCase();
  const cats = [];
  CUISINE_CATEGORIES.forEach(c => {
    const kwHit = c.match.some(k => raw.includes(k));
    const amenityHit = c.amenity && c.amenity === amenity;
    if (kwHit || amenityHit) cats.push(c.label);
  });
  return cats;
}

function buildQuery(bbox) {
  const box = `${bbox.s},${bbox.w},${bbox.n},${bbox.e}`;
  return `[out:json][timeout:40];
(
  node["amenity"~"^(restaurant|cafe|fast_food)$"](${box});
  way["amenity"~"^(restaurant|cafe|fast_food)$"](${box});
  relation["amenity"~"^(restaurant|cafe|fast_food)$"](${box});
);
out center tags;`;
}

function elementToRestaurant(el) {
  const lat = el.lat ?? el.center?.lat;
  const lon = el.lon ?? el.center?.lon;
  const tags = el.tags || {};
  const street = tags["addr:street"];
  const num = tags["addr:housenumber"];
  const rawCuisine = tags.cuisine || "";
  const amenity = tags.amenity || "";
  const website = tags.website || tags["contact:website"] || "";
  const openingHours = tags.opening_hours || "";
  return {
    id: `${el.type}/${el.id}`,
    lat, lon,
    name: tags.name || "Nimetön kohde",
    cuisine: rawCuisine ? rawCuisine.replace(/_/g, " ").replace(/;/g, ", ") : "Tyyppi ei tiedossa",
    cuisineUnknown: !rawCuisine,
    addr: street ? `${street}${num ? " " + num : ""}` : "",
    website,
    openingHours,
    amenity,
    categories: computeCategories(rawCuisine, amenity)
  };
}

function setLoadingBanner(state, text) {
  const el = document.getElementById('loadingBanner');
  const textEl = el.querySelector('.loading-text');
  if (state === 'loading') {
    textEl.textContent = text || 'Haetaan ravintolat';
    el.classList.remove('error');
    el.classList.add('visible');
  } else if (state === 'error') {
    textEl.textContent = text || 'Haku epäonnistui';
    el.classList.add('visible', 'error');
  } else {
    el.classList.remove('visible', 'error');
  }
}

async function loadAllRestaurantsOnce() {
  const status = document.getElementById('status');
  setLoadingBanner('loading');
  status.textContent = "· haetaan…";
  try {
    const query = buildQuery(TAMPERE_BBOX);
    const res = await fetch(OVERPASS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "data=" + encodeURIComponent(query)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    restaurants = data.elements
      .map(elementToRestaurant)
      .filter(r => r.lat && r.lon);
    rebuildMarkers();
    applyFiltersToMap();
    updateHeaderInfo();
    renderList();
    renderFavorites();
    updateFavTabLabel();
    setLoadingBanner('done');
    status.textContent = "";
  } catch (err) {
    setLoadingBanner('error', 'Ravintoloiden haku epäonnistui. Yritä uudelleen.');
    status.textContent = "";
  }
}

function rebuildMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  for (const k in markers) delete markers[k];
  restaurants.forEach(r => {
    const marker = L.marker([r.lat, r.lon]);
    marker.bindPopup(popupHtml(r), { maxWidth: 240, minWidth: 190 });
    markers[r.id] = marker;
  });
  applyFiltersToMap();
}

// Aktiiviset suodattimet.
const activeFilters = { types: new Set(), minRatingAvg: 0, minRatingOwn: 0, openNow: false, lunchRunning: false };

// Nopea nimihaku listasuodattimien alla. Suodattaa vasta kun kirjoitettu
// vähintään 2 merkkiä, pienellä viiveellä ettei jokainen näppäily hae erikseen.
let nameQuery = '';

function matchesFilters(r) {
  if (nameQuery.length >= 2 && !r.name.toLowerCase().includes(nameQuery)) return false;
  if (activeFilters.minRatingAvg > 0 && getCommunityAvg(r.id) < activeFilters.minRatingAvg) return false;
  if (activeFilters.minRatingOwn > 0 && getRating(r.id) < activeFilters.minRatingOwn) return false;
  if (activeFilters.types.size > 0) {
    const hit = r.categories.some(c => activeFilters.types.has(c));
    if (!hit) return false;
  }
  if (activeFilters.openNow) {
    const open = isOpenNow(r.openingHours);
    // Tuntematon aukioloaika piilotetaan kun suodatin on päällä — emme voi väittää sen olevan auki.
    if (open !== true) return false;
  }
  if (activeFilters.lunchRunning && isLunchHourNow()) {
    const open = isOpenNow(r.openingHours);
    if (open !== true) return false;
  }
  return true;
}

function hasActiveFilters() {
  return activeFilters.types.size > 0 || activeFilters.minRatingAvg > 0 || activeFilters.minRatingOwn > 0 || activeFilters.openNow || activeFilters.lunchRunning;
}

function activeFilterCount() {
  return activeFilters.types.size
    + (activeFilters.minRatingAvg > 0 ? 1 : 0)
    + (activeFilters.minRatingOwn > 0 ? 1 : 0)
    + (activeFilters.openNow ? 1 : 0)
    + (activeFilters.lunchRunning ? 1 : 0);
}

function applyFiltersToMap() {
  restaurants.forEach(r => {
    const m = markers[r.id];
    if (!m) return;
    const show = matchesFilters(r);
    if (show && !map.hasLayer(m)) map.addLayer(m);
    if (!show && map.hasLayer(m)) map.removeLayer(m);
  });
  const count = activeFilterCount();
  document.getElementById('filterCount').textContent = count > 0 ? ` (${count})` : '';
  updateFilterApplyButton();
}

function updateFilterApplyButton() {
  const matchCount = restaurants.filter(matchesFilters).length;
  document.getElementById('filterApply').textContent = `Näytä tulokset (${matchCount})`;
}

// userData tallentaa per-ravintola suosikkitilan JA 1-5 tähden arvostelun.
// localStorage säilyy selaimen sulkemisen ylikin.
let userData = {};
try {
  userData = JSON.parse(localStorage.getItem('tampereLounasUserData') || '{}');
} catch (e) {
  userData = {};
}
function saveUserData() {
  try { localStorage.setItem('tampereLounasUserData', JSON.stringify(userData)); } catch (e) {}
}
function isFav(id) { return !!(userData[id] && userData[id].fav); }
function getRating(id) { return (userData[id] && userData[id].rating) || 0; }

// --- DEMO: simuloitu yhteisön keskiarvo ---
// Oikeassa toteutuksessa tämä data tulisi backendistä (esim. Firestore/Supabase),
// koska muiden käyttäjien arviot eivät voi asua pelkässä selaimen localStoragessa.
// Tässä demossa "muiden arviot" on generoitu deterministisesti ravintolan id:stä,
// jotta jokainen ravintola näyttää uskottavan mutta kiinteän lähtötilanteen, ja
// oma arviosi lasketaan oikeasti mukaan keskiarvoon kun arvostelet.
let communityRatings = {};
try {
  communityRatings = JSON.parse(localStorage.getItem('tampereLounasCommunityRatings') || '{}');
} catch (e) {
  communityRatings = {};
}
function saveCommunityRatings() {
  try { localStorage.setItem('tampereLounasCommunityRatings', JSON.stringify(communityRatings)); } catch (e) {}
}
function seedCommunityIfNeeded(id) {
  if (communityRatings[id]) return;
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  const count = 3 + (hash % 35);            // 3–37 "muiden" arviota
  const avgSeed = 2.8 + ((hash >> 5) % 21) / 10; // 2.8–4.8 tähteä keskimäärin
  communityRatings[id] = { sum: Math.round(avgSeed * count), count };
}
function getCommunityAvg(id) {
  seedCommunityIfNeeded(id);
  const c = communityRatings[id];
  return c.count > 0 ? c.sum / c.count : 0;
}
function getCommunityCount(id) {
  seedCommunityIfNeeded(id);
  return communityRatings[id].count;
}

const map = L.map('map', { zoomControl: true }).setView([61.4978, 23.7610], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap-tekijät'
}).addTo(map);

const markers = {};

// Yksi tähtirivi: harmaa pohja + korostusvärinen täyttö keskiarvon mukaan
// (myös puolikkaat, CSS leveys-%), ja sen päällä 5 näkymätöntä klikkausaluetta
// joilla annetaan oma arvio. Sama elementti siis sekä näyttää että kerää arviot.
function starsHtml(id) {
  const avg = getCommunityAvg(id);
  const count = getCommunityCount(id);
  const own = getRating(id);
  const fillPct = Math.max(0, Math.min(100, (avg / 5) * 100));
  const clicks = [1, 2, 3, 4, 5]
    .map(i => `<button type="button" aria-label="Anna ${i} tähden arvio" aria-pressed="${own === i}"
        onmouseenter="starHoverPreview(event, ${i})"
        onclick="event.stopPropagation(); setRating('${id}', ${i})"></button>`)
    .join('');
  const metaText = count > 0 ? `${avg.toFixed(1)} (${count})` : 'Ei arvioita vielä';
  const ownText = own > 0 ? ` · Arviosi ★${own}` : '';
  const avgLabel = count > 0 ? `Keskiarvo ${avg.toFixed(1)} tähteä, ${count} arviota.` : 'Ei arvioita vielä.';
  return `<div class="rating-row">
    <span class="stars-display" role="group" aria-label="${avgLabel}${own > 0 ? ' Oma arviosi: ' + own + ' tähteä.' : ''}" onmouseleave="starHoverEnd(event)">
      <span class="stars-bg" aria-hidden="true">★★★★★</span>
      <span class="stars-fg" aria-hidden="true" style="width:${fillPct}%">★★★★★</span>
      <span class="stars-hover" aria-hidden="true">★★★★★</span>
      <span class="stars-click">${clicks}</span>
    </span>
    <span class="rating-meta">${metaText}${ownText}</span>
  </div>`;
}

// Hover-esikatselu: näytä täytettynä juuri niin monta tähteä kuin hoveroitu
// kohta edustaa, ja piilota sillä aikaa yleinen keskiarvotäyttö ettei ne sekoitu.
function starHoverPreview(e, n) {
  const group = e.currentTarget.closest('.stars-display');
  if (!group) return;
  group.querySelector('.stars-hover').style.width = (n / 5 * 100) + '%';
  group.classList.add('hovering');
}
function starHoverEnd(e) {
  const group = e.currentTarget.closest('.stars-display') || e.currentTarget;
  const hoverEl = group.querySelector('.stars-hover');
  if (hoverEl) hoverEl.style.width = '0%';
  group.classList.remove('hovering');
}

function heartHtml(id) {
  const fav = isFav(id);
  return `<button class="heart" onclick="event.stopPropagation(); toggleFav('${id}')" aria-pressed="${fav}" aria-label="${fav ? 'Poista suosikeista' : 'Lisää suosikiksi'}">${fav ? '♥' : '♡'}</button>`;
}

// Karkea OSM opening_hours -tulkinta: etsii arkipäivän (ma-pe) aikaisimman
// aukeamisajan. Palauttaa true jos aukeaa klo 12 tai myöhemmin (ei todennäköisesti
// auki lounasaikaan), false jos aukeaa klo 11 mennessä jonain arkipäivänä, ja
// null jos tietoa ei ole tai syntaksi on liian monimutkainen tulkittavaksi
// luotettavasti (jolloin emme näytä mitään väitettä).
const WEEKDAY_CODES = ['Mo', 'Tu', 'We', 'Th', 'Fr'];
const DAY_ORDER = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];

function expandDayToken(token) {
  if (token.includes('-')) {
    const [a, b] = token.split('-');
    const ai = DAY_ORDER.indexOf(a), bi = DAY_ORDER.indexOf(b);
    if (ai === -1 || bi === -1) return [];
    const days = [];
    let i = ai;
    while (true) {
      days.push(DAY_ORDER[i]);
      if (i === bi) break;
      i = (i + 1) % 7;
    }
    return days;
  }
  return DAY_ORDER.includes(token) ? [token] : [];
}

function parseTimeToMinutes(t) {
  const m = t.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}

function weekdayOpensLateOrUnknown(openingHours) {
  if (!openingHours) return null;
  const oh = openingHours.trim();
  if (/^24\/7$/i.test(oh)) return false;

  const rules = oh.split(';').map(s => s.trim()).filter(Boolean);
  let sawWeekdayRule = false;
  let earliestStart = null;
  let anyWeekdayClosedAllDay = false;

  for (const rule of rules) {
    const match = rule.match(/^([A-Za-z,\-]+)\s+(.+)$/);
    if (!match) continue;
    const dayPart = match[1];
    const timePart = match[2].trim();
    if (/^PH$|^SH$/i.test(dayPart)) continue;

    let days = [];
    dayPart.split(',').forEach(g => {
      if (/^PH$|^SH$/i.test(g)) return;
      days = days.concat(expandDayToken(g));
    });
    const weekdaysInRule = days.filter(d => WEEKDAY_CODES.includes(d));
    if (weekdaysInRule.length === 0) continue;
    sawWeekdayRule = true;

    if (/^off$|^closed$/i.test(timePart)) {
      anyWeekdayClosedAllDay = true;
      continue;
    }

    timePart.split(',').forEach(range => {
      const startMatch = range.match(/^(\d{1,2}:\d{2})/);
      if (!startMatch) return;
      const startMin = parseTimeToMinutes(startMatch[1]);
      if (startMin === null) return;
      if (earliestStart === null || startMin < earliestStart) earliestStart = startMin;
    });
  }

  if (!sawWeekdayRule) return null;
  if (earliestStart === null) return anyWeekdayClosedAllDay ? true : null;
  return earliestStart >= 12 * 60;
}

// Jäsentää opening_hours-merkinnän sääntölistaksi: mitkä päivät, ovatko kiinni
// vai ajat, ja millä aikaväleillä. Karkea mutta kattaa yleisimmät OSM-muodot.
function parseOpeningHoursRules(openingHours) {
  if (!openingHours) return null;
  const oh = openingHours.trim();
  if (/^24\/7$/i.test(oh)) {
    return [{ days: DAY_ORDER.slice(), off: false, ranges: [{ start: 0, end: 24 * 60 }] }];
  }
  const rules = oh.split(';').map(s => s.trim()).filter(Boolean);
  const parsed = [];
  for (const rule of rules) {
    const match = rule.match(/^([A-Za-z,\-]+)\s+(.+)$/);
    if (!match) continue;
    const dayPart = match[1];
    const timePart = match[2].trim();
    if (/^PH$|^SH$/i.test(dayPart)) continue;

    let days = [];
    dayPart.split(',').forEach(g => {
      if (/^PH$|^SH$/i.test(g)) return;
      days = days.concat(expandDayToken(g));
    });
    if (days.length === 0) continue;

    if (/^off$|^closed$/i.test(timePart)) {
      parsed.push({ days, off: true, ranges: [] });
      continue;
    }

    const ranges = [];
    timePart.split(',').forEach(part => {
      const rm = part.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})/);
      if (!rm) return;
      const start = parseInt(rm[1], 10) * 60 + parseInt(rm[2], 10);
      const end = parseInt(rm[3], 10) * 60 + parseInt(rm[4], 10);
      ranges.push({ start, end });
    });
    if (ranges.length) parsed.push({ days, off: false, ranges });
  }
  return parsed;
}

// Onko ravintola auki juuri nyt? true/false, tai null jos dataa ei ole tai
// tälle viikonpäivälle ei löydy yhtään sääntöä.
function isOpenNow(openingHours) {
  const parsed = parseOpeningHoursRules(openingHours);
  if (!parsed || parsed.length === 0) return null;

  const now = new Date();
  const dayCode = DAY_ORDER[(now.getDay() + 6) % 7]; // JS: 0=su..6=la -> Mo..Su
  const nowMin = now.getHours() * 60 + now.getMinutes();

  let matchedToday = false;
  let open = false;
  parsed.forEach(rule => {
    if (!rule.days.includes(dayCode)) return;
    matchedToday = true;
    if (rule.off) { open = false; return; }
    rule.ranges.forEach(r => {
      if (r.end >= r.start) {
        if (nowMin >= r.start && nowMin < r.end) open = true;
      } else {
        // yli puolenyön menevä aikaväli, esim. 18:00-02:00
        if (nowMin >= r.start || nowMin < r.end) open = true;
      }
    });
  });

  if (!matchedToday) return null;
  return open;
}

// "Lounas käynnissä" -suodatin ei katso ravintolakohtaista lounasaikaa (ei
// luotettavaa dataa saatavilla) vaan pelkkää kellonaikaa: klo 11–14.
function isLunchHourNow() {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  return nowMin >= 11 * 60 && nowMin < 14 * 60;
}

function openingHoursHtml(r) {
  if (weekdayOpensLateOrUnknown(r.openingHours) === true) {
    return `<p class="hours hours-warning">Ei auki lounasaikaan</p>`;
  }
  return '';
}

function normalizeUrl(url) {
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

function websiteLinkHtml(r) {
  if (!r.website) return '';
  return `<a class="website-link" href="${normalizeUrl(r.website)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Lounaslista</a>`;
}

const ADDR_ICON = '<svg class="pin-icon" viewBox="0 0 24 24" width="11" height="11" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M12 2C7.6 2 4 5.6 4 10c0 5.4 6.7 11.1 7 11.3c.3.2.7.2 1 0c.3-.2 7-5.9 7-11.3c0-4.4-3.6-8-8-8zm0 11a3 3 0 1 1 0-6a3 3 0 0 1 0 6z"/></svg>';

function genreHtml(r) {
  if (r.cuisineUnknown) return `<span class="genre-plain">${r.cuisine}</span>`;
  return `<span class="genre">${r.cuisine}</span>`;
}

function popupHtml(r) {
  return `<div class="popup-top">
      <h3>${r.name}</h3>
      ${heartHtml(r.id)}
    </div>
    ${genreHtml(r)}
    <div class="addr">${r.addr ? ADDR_ICON + ' ' + r.addr : ''}</div>
    ${openingHoursHtml(r)}
    ${websiteLinkHtml(r)}
    <div class="popup-actions">
      ${starsHtml(r.id)}
    </div>`;
}

function toggleFav(id) {
  userData[id] = userData[id] || {};
  userData[id].fav = !userData[id].fav;
  saveUserData();
  refreshAfterUserAction(id);
}
window.toggleFav = toggleFav;

function setRating(id, val) {
  userData[id] = userData[id] || {};
  const prev = userData[id].rating || 0;
  seedCommunityIfNeeded(id);
  const c = communityRatings[id];

  if (val === prev) {
    // sama tähti uudelleen -> poistetaan oma arvio kokonaan yhteisökeskiarvosta
    if (prev > 0) { c.sum -= prev; c.count = Math.max(0, c.count - 1); }
    userData[id].rating = 0;
  } else {
    if (prev > 0) c.sum = c.sum - prev + val;   // korvataan aiempi oma arvio
    else { c.sum += val; c.count += 1; }        // ensimmäinen oma arvio tälle ravintolalle
    userData[id].rating = val;
  }

  saveUserData();
  saveCommunityRatings();
  refreshAfterUserAction(id);
}
window.setRating = setRating;

function refreshAfterUserAction(id) {
  if (markers[id]) markers[id].setPopupContent(popupHtml(restaurants.find(r => r.id === id)));
  applyFiltersToMap(); // arvostelu voi vaikuttaa "arvosana vähintään" -suodattimeen
  renderList();
  renderFavorites();
  updateFavTabLabel();
}

function visibleRestaurants() {
  const b = map.getBounds();
  return restaurants.filter(r => matchesFilters(r) && b.contains([r.lat, r.lon]));
}

function currentListRestaurants() {
  return (listFilterMode === 'all' ? restaurants : visibleRestaurants()).filter(matchesFilters);
}

function updateHeaderInfo() {
  const countEl = document.getElementById('countNum');
  const labelEl = document.getElementById('countLabel');
  const list = currentListRestaurants();
  countEl.textContent = list.length;
  labelEl.textContent = listFilterMode === 'all' ? "ravintolaa yhteensä" : "ravintolaa näkyvissä";
}

function updateFavTabLabel() {
  const count = restaurants.filter(r => isFav(r.id)).length;
  document.getElementById('tabFav').textContent = `♥ (${count})`;
  document.getElementById('sbTabFav').textContent = `Suosikit (${count})`;
}

function cardHtml(r) {
  return `
    <div class="card" role="button" tabindex="0" aria-label="Näytä ${r.name} kartalla"
      onclick="focusOnMap('${r.id}')"
      onkeydown="if(event.target===event.currentTarget && (event.key==='Enter'||event.key===' ')){event.preventDefault(); focusOnMap('${r.id}');}">
      <div class="card-top">
        <h3>${r.name}</h3>
        ${heartHtml(r.id)}
      </div>
      ${genreHtml(r)}
      <p class="addr">${r.addr ? ADDR_ICON + ' ' + r.addr : ''}</p>
      ${openingHoursHtml(r)}
      ${websiteLinkHtml(r)}
      <div class="card-actions">
        ${starsHtml(r.id)}
      </div>
    </div>
  `;
}

function renderList() {
  const el = document.getElementById('listCards');
  const list = currentListRestaurants();
  el.innerHTML = list.map(cardHtml).join('') || '<p class="empty-hint">Ei ravintoloita. Kokeile "Kaikki ravintolat" tai zoomaa ulos kartalla.</p>';
  updateHeaderInfo();
}

function renderFavorites() {
  const el = document.getElementById('favView');
  const favs = restaurants
    .filter(r => isFav(r.id) && matchesFilters(r))
    .sort((a, b) => getRating(b.id) - getRating(a.id) || a.name.localeCompare(b.name, 'fi'));
  el.innerHTML = favs.map(cardHtml).join('') || '<p class="empty-hint">Ei vielä suosikkeja, tai suodattimet piilottavat ne. Tarkista Suodata.</p>';
}

function focusOnMap(id) {
  const r = restaurants.find(x => x.id === id);
  if (!r) return;
  // Vaihdetaan ensin kartta näkyviin (ja invalidateSize), koska Leafletin setView
  // piirtyy väärin jos karttaelementti on vielä display:none kutsuhetkellä —
  // tämä oli syy siihen ettei kortista pääsyt kartalle.
  showTab('map');
  setTimeout(() => {
    map.invalidateSize();
    map.setView([r.lat, r.lon], 16);
    if (markers[id]) markers[id].openPopup();
  }, 60);
}
window.focusOnMap = focusOnMap;

map.on('moveend zoomend', () => {
  if (listFilterMode === 'visible') renderList();
  else updateHeaderInfo();
});

function showTab(which) {
  currentTab = which;
  document.getElementById('tabMap').classList.toggle('active', which === 'map');
  document.getElementById('tabList').classList.toggle('active', which === 'list');
  document.getElementById('tabFav').classList.toggle('active', which === 'fav');
  document.getElementById('tabMap').setAttribute('aria-selected', which === 'map');
  document.getElementById('tabList').setAttribute('aria-selected', which === 'list');
  document.getElementById('tabFav').setAttribute('aria-selected', which === 'fav');
  document.getElementById('map').classList.toggle('m-active', which === 'map');
  document.getElementById('listView').classList.toggle('m-active', which === 'list');
  document.getElementById('favView').classList.toggle('m-active', which === 'fav');

  if (which === 'map') setTimeout(() => map.invalidateSize(), 50);
  if (which === 'list') renderList();
  if (which === 'fav') renderFavorites();
}
document.getElementById('tabMap').onclick = () => showTab('map');
document.getElementById('tabList').onclick = () => showTab('list');
document.getElementById('tabFav').onclick = () => showTab('fav');

// Työpöytäversion pysyvän sivupalkin Lista/Suosikit-vaihto (erillinen tila
// mobiilin currentTab-muuttujasta, jotta molemmat toimivat itsenäisesti ikkunan
// koosta riippumatta, ilman resize-kuuntelijaa CSS:n hoitaessa loput).
function showSidebarTab(which) {
  document.getElementById('sbTabList').classList.toggle('active', which === 'list');
  document.getElementById('sbTabFav').classList.toggle('active', which === 'fav');
  document.getElementById('sbTabList').setAttribute('aria-selected', which === 'list');
  document.getElementById('sbTabFav').setAttribute('aria-selected', which === 'fav');
  document.getElementById('listView').classList.toggle('d-active', which === 'list');
  document.getElementById('favView').classList.toggle('d-active', which === 'fav');
  if (which === 'list') renderList();
  if (which === 'fav') renderFavorites();
}
document.getElementById('sbTabList').onclick = () => showSidebarTab('list');
document.getElementById('sbTabFav').onclick = () => showSidebarTab('fav');

document.getElementById('sidebarCollapseBtn').onclick = () => {
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('sidebarCollapseBtn');
  const collapsed = sidebar.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded', String(!collapsed));
  btn.setAttribute('aria-label', collapsed ? 'Laajenna lista-palkki' : 'Pienennä lista-palkki');
  setTimeout(() => map.invalidateSize(), 210); // odotetaan CSS-transitionin loppuminen
};

// Leaflet tarvitsee invalidateSize() kun kartan säiliön koko muuttuu, esim.
// kun ikkuna resataan mobiili- ja työpöytäleveyden yli (sivupalkki ilmestyy/katoaa).
window.addEventListener('resize', () => map.invalidateSize());

let nameSearchTimer = null;
const nameSearchInput = document.getElementById('nameSearch');
const searchClearBtn = document.getElementById('searchClear');

nameSearchInput.addEventListener('input', (e) => {
  const val = e.target.value;
  searchClearBtn.classList.toggle('visible', val.length > 0);
  clearTimeout(nameSearchTimer);
  nameSearchTimer = setTimeout(() => {
    nameQuery = val.trim().toLowerCase();
    applyFiltersToMap();
    renderList();
    renderFavorites();
  }, 100);
});

searchClearBtn.onclick = () => {
  nameSearchInput.value = '';
  searchClearBtn.classList.remove('visible');
  clearTimeout(nameSearchTimer);
  nameQuery = '';
  applyFiltersToMap();
  renderList();
  renderFavorites();
  nameSearchInput.focus();
};

document.getElementById('filterVisible').onclick = () => {
  listFilterMode = 'visible';
  document.getElementById('filterVisible').classList.add('active');
  document.getElementById('filterAll').classList.remove('active');
  renderList();
};
document.getElementById('filterAll').onclick = () => {
  listFilterMode = 'all';
  document.getElementById('filterAll').classList.add('active');
  document.getElementById('filterVisible').classList.remove('active');
  renderList();
};

// --- Suodatinpaneeli ---
const typeChipsNationalityEl = document.getElementById('typeChipsNationality');
const typeChipsStyleEl = document.getElementById('typeChipsStyle');
CUISINE_CATEGORIES.forEach(c => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.textContent = c.label;
  chip.setAttribute('aria-pressed', 'false');
  chip.onclick = () => {
    if (activeFilters.types.has(c.label)) activeFilters.types.delete(c.label);
    else activeFilters.types.add(c.label);
    chip.classList.toggle('active');
    chip.setAttribute('aria-pressed', chip.classList.contains('active'));
    applyFiltersToMap();
    renderList();
    renderFavorites();
  };
  (c.group === 'nationality' ? typeChipsNationalityEl : typeChipsStyleEl).appendChild(chip);
});

const ratingChipsAvgEl = document.getElementById('ratingChipsAvg');
[1, 2, 3, 4].forEach(n => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.textContent = '★'.repeat(n);
  chip.setAttribute('aria-label', `Vähintään ${n} tähteä, kaikkien arviot`);
  chip.setAttribute('aria-pressed', 'false');
  chip.onclick = () => {
    activeFilters.minRatingAvg = (activeFilters.minRatingAvg === n) ? 0 : n;
    [...ratingChipsAvgEl.children].forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
    if (activeFilters.minRatingAvg === n) { chip.classList.add('active'); chip.setAttribute('aria-pressed', 'true'); }
    applyFiltersToMap();
    renderList();
    renderFavorites();
  };
  ratingChipsAvgEl.appendChild(chip);
});

const ratingChipsOwnEl = document.getElementById('ratingChipsOwn');
[1, 2, 3, 4].forEach(n => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.textContent = '★'.repeat(n);
  chip.setAttribute('aria-label', `Vähintään ${n} tähteä, omat arviot`);
  chip.setAttribute('aria-pressed', 'false');
  chip.onclick = () => {
    activeFilters.minRatingOwn = (activeFilters.minRatingOwn === n) ? 0 : n;
    [...ratingChipsOwnEl.children].forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
    if (activeFilters.minRatingOwn === n) { chip.classList.add('active'); chip.setAttribute('aria-pressed', 'true'); }
    applyFiltersToMap();
    renderList();
    renderFavorites();
  };
  ratingChipsOwnEl.appendChild(chip);
});

document.getElementById('chipOpen').onclick = () => {
  activeFilters.openNow = !activeFilters.openNow;
  document.getElementById('chipOpen').classList.toggle('active', activeFilters.openNow);
  document.getElementById('chipOpen').setAttribute('aria-pressed', activeFilters.openNow);
  applyFiltersToMap();
  renderList();
  renderFavorites();
};
document.getElementById('chipLunch').onclick = () => {
  activeFilters.lunchRunning = !activeFilters.lunchRunning;
  document.getElementById('chipLunch').classList.toggle('active', activeFilters.lunchRunning);
  document.getElementById('chipLunch').setAttribute('aria-pressed', activeFilters.lunchRunning);
  applyFiltersToMap();
  renderList();
  renderFavorites();
};

let filterOpenerEl = null;
function handleFilterPanelKeydown(e) {
  if (e.key === 'Escape') { closeFilterPanel(); return; }
  if (e.key === 'Tab') {
    const overlay = document.getElementById('filterOverlay');
    const focusables = Array.from(overlay.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])'))
      .filter(el => el.offsetParent !== null);
    if (focusables.length === 0) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
function openFilterPanel() {
  filterOpenerEl = document.activeElement;
  const overlay = document.getElementById('filterOverlay');
  overlay.removeAttribute('hidden');
  overlay.classList.add('open');
  document.getElementById('filterBackdrop').classList.add('open');
  document.getElementById('openFilter').setAttribute('aria-expanded', 'true');
  updateFilterApplyButton();
  document.getElementById('filterClose').focus();
  document.addEventListener('keydown', handleFilterPanelKeydown);
}
function closeFilterPanel() {
  document.getElementById('filterOverlay').classList.remove('open');
  document.getElementById('filterBackdrop').classList.remove('open');
  document.getElementById('openFilter').setAttribute('aria-expanded', 'false');
  document.removeEventListener('keydown', handleFilterPanelKeydown);
  if (filterOpenerEl) filterOpenerEl.focus();
}
document.getElementById('openFilter').onclick = openFilterPanel;
document.getElementById('filterClose').onclick = closeFilterPanel;
document.getElementById('filterApply').onclick = closeFilterPanel;
document.getElementById('filterBackdrop').onclick = closeFilterPanel;
document.getElementById('filterReset').onclick = () => {
  activeFilters.types.clear();
  activeFilters.minRatingAvg = 0;
  activeFilters.minRatingOwn = 0;
  activeFilters.openNow = false;
  activeFilters.lunchRunning = false;
  document.getElementById('chipOpen').classList.remove('active');
  document.getElementById('chipLunch').classList.remove('active');
  document.getElementById('chipOpen').setAttribute('aria-pressed', 'false');
  document.getElementById('chipLunch').setAttribute('aria-pressed', 'false');
  [...typeChipsNationalityEl.children].forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  [...typeChipsStyleEl.children].forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  [...ratingChipsAvgEl.children].forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  [...ratingChipsOwnEl.children].forEach(c => { c.classList.remove('active'); c.setAttribute('aria-pressed', 'false'); });
  applyFiltersToMap();
  renderList();
  renderFavorites();
};

showTab('map');
showSidebarTab('list');
renderList();
updateFavTabLabel();
loadAllRestaurantsOnce();
</script>
